notes: >-
  D standard tuning (D G C F). Two bass tracks: "Sub Bass" (chosen, 371 notes) plays the main
  riff through the whole song; "Dirty Bass" (138 notes) is the distorted synth layer and could
  be added as a second song if wanted. The 8-bar riff (A B A B / C D E F in the pattern grid) is
  split into its two 4-bar halves. Bass tacet in 24, 33–34, 43–49, 58, 67–68, 85, 96–97;
  Verse 2 a starts with the bar-50 pickup (5 bars) so the riff from bar 51 stays whole. Tempo
  135 BPM, dropping to 120 BPM at the Interlude (bar 86) for the slow half of the song. Interlude
  keeps the 2-bar K L figure twice in one chunk (it is only 4 s long). Fingering: one shift of
  3+ frets, from the bar-50 pickup into the riff at bar 51; no re-tabs, no overrides.
