notes: >-
  E♭ standard (E♭ A♭ C♯ F♯). 141–152 BPM, 143 at the start. Bars 1–5 are tacet: bar 1 is a
  one-eighth pickup and the drums play the intro alone. The bass enters in bar 6 with the chromatic
  triplet run down the A♭ string from E♭ (fret 19) to F (fret 9) and the open A♭. Chunks follow the
  12 section markers; the score numbers them Verse I, Chorus 2, Chorus III, here Verse 1–3 and Chorus
  1–3. The verse riff is a four-bar walking line at position 6–7 (E♭–B♭–A♭–G, C♯–A♭–G–C♯–F,
  E♭–B♭–A♭–G, then a C♯ bar of double stops), and the chunks follow it: 7–10, 11–14 and so on, with
  the entry run in Intro a (6–10). Bar 30 and bars 102–103: the C♯ triplet build-up into the chorus;
  Verse 3 c is five bars (99–103) for that reason. Chorus and Interlude: B♭ and A♭ against the open
  E♭ in eighths, then A♭, in four-bar chunks of the two-bar figure. Instrumental, Break, Verse 3 a and
  Outro: the two-bar E♭–A♭–B♭ figure with C♯ double stops. Bridge: the verse line in eighths, then
  C♯–C–B♭–A♭ down the A♭ string. Fingering: 11 re-tabs. Bridge (68–74): the C♯ that starts the
  descent goes to the open C♯ string, which covers the shift down from position 6. Bar 103: the A♭s
  before the chorus go to the open A♭ string. Override: bar 102, the C♯ triplets on A♭ 5 as tabbed
  and as in bar 30; the solver had moved the whole run of 21 notes to the open string. Bar 6: the
  entry run moves from position 16 to 9 along the A♭ string. YouTube: 4poa1zXph5E, "Green Day -
  Longview - [HQ]" by BunczucznyKKS, Songsterr's default video for song 23529
  (songsterr.com/a/wsa/green-day-longview-bass-tab-s23529), revision 9992201. It is a third-party
  upload; it plays and embeds from Norway (checked 2026-11-06). Songsterr has 137 points for 143
  bars: bars 138–143 have no point and continue at the score's tempo. Bar 1 (the pickup) is ×0.43 of
  its length; at most 0.55 s from the tempo map (bar 121). Songsterr's API answers 403 to scripts, so
  the points were read from the tab's page in the browser on 2026-11-06 and replayed to fetch-video.
  Music: offset 0 ms (onset match 1.83 in the first minute), but −140 ms (1.56) in the last minute:
  the MP3 drifts from the tempo map. Lyrics: synced from "Billie Joe Armstrong | Lead Vocals", 307
  syllables from bar 15; lines cut by timing. To check by ear: the Music drift near the end; the
  YouTube sync in bars 138–143.
