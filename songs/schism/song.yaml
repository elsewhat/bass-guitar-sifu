notes: >-
  Drop D (D A D G). Bars 1–3 are a slow intro at 64 BPM (5/4, 5/4, 4/4); from bar 4 the riff runs at
  106–113 BPM in alternating 5/8 and 7/8 bars, with 6/8, 9/8, 3/8, 3/4 and 2/4 bars later. The
  inspect warning about half time comes from the intro. Bars 121–127 and 238 are tacet. The tab has
  a second bass track, "Bass Whammy Effect" (107 notes), which is not imported. Chunks follow the 18
  section markers; repeated sections are numbered. The riff is a two-bar cell (5/8 + 7/8: F–E–G over
  the open D, then a step down, E–D–F), so the riff chunks are four bars, two cells. Chorus: the
  same cell on A (6/8 + 7/8). Interlude 1 (76–85): D–F–G in 4/4 + 2/4, and the riff's two bars into
  Verse 3 (c). Post-Chorus (110–120): a 9/8 + 5/8 figure on A, ending on an A held into the Bridge.
  Bridge a (128–137) is 10 bars: A1, A2 and A3 a bar each, the A3 held through two 5-bar meter
  cycles (6/8 6/8 6/8 3/8 3/4); one chunk, because the held bars have no plucks. Bridge b–d and
  Bridge Verse a–b follow that cycle; Bridge Verse c (178–183) is the held A chord and the dead-note
  bars into the Build-Up. Climax: two 5-bar cycles. Outro Verse a–b (214–221) is the riff an octave
  lower on the low D string, c–d (222–229) the riff as in the intro. Outro (230–237): one 4/4 bar of
  triplet runs (D–F–G, D–F♯–G♯) eight times. Fingering: 4 re-tabs (C2 D10 → A3 in bar 205, D2 A5 →
  D0 in 221). No overrides. The Outro bar moves between positions 3, 4 and 5, because the step from
  G (low D 5) to D (A 5) at the same fret is not rolled (ADR-0007 rule 6). YouTube: 80RtBeB61LE,
  "TOOL - Schism (Official Audio)" by TOOLVEVO, Songsterr's default video for song 6700
  (songsterr.com/a/wsa/tool-schism-bass-tab-s6700), revision 10203070: 238 anchors for 238 bars, bar
  1 at 0:00.51; bars 84–85, 180–181, 206 and 208 are far from the score's length (×0.82–1.26); at
  most 1.5 s from the tempo map (bar 181). Songsterr's API answers 403 to scripts, so the points
  were read from the tab's page in the browser on 2026-11-06 and replayed to fetch-video. It plays
  and embeds from Norway (checked 2026-11-06). Music: offset 10 ms, drift −10 ms (onset match 2.27 /
  1.96). Lyrics: synced from "Maynard James Keenan | Vocals", 331 syllables from bar 20; lines cut
  by timing. To check by ear: Bridge a as one 10-bar chunk; the meter cycles once a video is synced.
