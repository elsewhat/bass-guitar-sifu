notes: >-
  Standard tuning, 123 BPM throughout, matching the recording (no half/double-time issue).
  Tacet: 1–9 (clean guitar intro) and 174. Chunks follow the 16 section markers in 4-bar
  phrases; repeated markers are numbered (Main Riff 1–2, Pre-Chorus 1–2, Chorus 1–3). Intro
  and Intro 2 (10–29) are the open-E eighth pedal with an F pickup, ending in E octaves
  (E string open + A7) in bars 28–29. Main Riff is the E–B♭–A figure on the E string (frets
  0–6) with the G–F♯–E tail; Verse is the E pedal again; Pre-Chorus is the F♯–B–F♯–B
  arpeggio (half notes on E2, A2, D4, G4); Chorus is F♯–C–B with the E-string fill in bars
  53/80/100/133. Chorus 1 is 7 bars (50–56), so Chorus 1 b is 3 bars; Guitar Solo e
  (101–103) is the chorus tail ending on a stop. Chorus 3 b (128–129) is the 2-bar extension
  (riff + E eighths) before the chorus repeats at 130. Outro a (138–139) is the whole-note E
  before the main riff returns at 140. Outro c repeat (150–153) differs from Outro c only by
  the tie into bar 146. Fade Out is straight open-E eighths. Fingering: no re-tabs; the 3+
  fret shifts at bars 54 and 134 (E7 fill → F♯ on E2) and bar 144 (B♭ on E6 → G on E3 at the
