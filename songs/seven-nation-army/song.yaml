notes: >-
  The record has no bass: Jack White plays the riff on guitar through an octave-down pitch
  shifter. This score ("With Bass Guitar") adds a 4-string bass track playing that part, which
  is what we practise; the title drops the "(With Bass Guitar)" suffix. The 2-bar riff (A B in
  the pattern grid) and its variants (C B, G B, A F) are chunked in 4-bar pairs; the 2-bar
  D E figure before each break is its own chunk. "Break 2 / Guitar solo" is shortened to Solo.
  Fingering: the riff ends on B (A string fret 2) and restarts on E (fret 7), so every second
  bar shifts from position 2 to 5; this is the riff itself, no overrides. 124 BPM steady,
  matching the record. YouTube (2026-10-11): Songsterr's default video for this tab, "The White
  Stripes - Seven Nation Army in Standard Tuning with 4 Count" by GOBBLESS GUITAR (oPxPMCmnxno).
  Sync anchors are Songsterr's point per bar (song 397405, revision 9427664; npm run fetch-video):
  117 anchors for 117 bars, bar 1 at 0:02.99, up to 2.8 s from the score's tempo map (bar 116).
lyrics:
  # Pasted by the owner for private practice; unsynced, ADR-0024.
  text: |
    [Verse 1]
    I'm gonna fight 'em off
    A seven-nation army couldn't hold me back
    They're gonna rip it off
    Takin' their time right behind my back
    And I'm talkin' to myself at night because I can't forget
    Back and forth through my mind, behind a cigarette
    And the message comin' from my eyes says, "Leave it alone"

    [Verse 2]
    Don't wanna hear about it
    Every single one's got a story to tell
    Everyone knows about it
    From the Queen of England to the Hounds of Hell
    And if I catch it comin' back my way, I'm gonna serve it to you
    And that ain't what you want to hear, but that's what I'll do
    And the feelin' comin' from my bones says, "Find a home"

    [Verse 3]
    I'm goin' to Wichita
    Far from this opera forevermore
    I'm gonna work the straw
    Make the sweat drip out of every pore
    And I'm bleedin' and I'm bleedin' and I'm bleedin' right before the Lord
    All the words are gonna bleed from me and I will think no more
    And the stains comin' from my blood tell me, "Go back home"
