notes: >-
  Standard tuning. 101 BPM; no half/double-time issue (score 4:40, album track 4:42). Bass enters
  at bar 6; bars 1–5 and 92–94 are tacet. The verse riff is 6/4; time signatures change 22 times
  (4/4 in 15–17, 21–22, 32–34, 43–53, the Bridge 2 bars and 87–91; 2/4 in 64, 67, 70, 73, 89).
  Chunks follow the 9 section markers; the three "Chorus" and two "Bridge" markers are numbered.
  The verse riff is a 2-bar 6/4 figure (12 beats): the first time is its own chunk, the three
  repeats are one chunk (in Verse 3 the last bar ends on E instead of B). Verse 1 b / Verse 2 b
  are the variation bar plus the 4/4 tag with the held C. Chorus 1 and Chorus 3 a are the
  octave-jump riff; Chorus 2 a is the verse riff again, Chorus 2 b and Chorus 3 b the same riff in
  fifths (double stops). Bridge 1 is a 3-bar phrase (B–E–A♭ into D pulses): a, its repeat, then b
  = the phrase plus two more bars of D. Bridge 2 is four 3-bar phrases of 4/4 + 4/4 + 2/4; a 2/4
  bar always stays with the phrase it ends, and d also takes the held C in bar 74. The draft split
  these on the wrong bars. Ending (87–91) is the tag in fifths and the held C5. Re-tabs accepted:
  the D of the tag (bars 33, 63, 66, 69, 72) is the open D string instead of A5, which avoids
  rolling the index from E5; the A♭ in bars 43, 46 and 49 moves from A11 to D6, which keeps the
  whole Bridge 1 phrase in position 5; the fill in bars 67 and 70 moves from D14/D12 to G9/G7,
  next to the G on A10. Chorus 3 b ×3 shows 14 shifts because the source tab alternates the fifths
  between frets 7–10 and frets 2–7 every bar; kept as transcribed. The large shifts in bar 78 lead
  into those fifths. No overrides. YouTube (2026-10-11): Songsterr's default video for this tab,
  "Fell On Black Days" by Soundgarden - Topic (aqW-VF49Sok). Sync anchors are Songsterr's point per
  bar (song 19633, revision 8622405; npm run fetch-video): 91 anchors for 94 bars, bar 1 at 0:01.00,
  up to 1.3 s from the score's tempo map (bar 91). To check by ear: bars 92–94: no point, continued
  at the score's tempo; bars whose length in the recording is far from the score: 1 (×0.74), 72
  (×1.25), 73 (×1.48), 89 (×1.41).
