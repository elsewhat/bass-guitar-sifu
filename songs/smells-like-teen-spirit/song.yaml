notes: >-
  Bass enters with a one-bar pickup in bar 4 (end of the guitar intro), merged with the
  band-in into Intro a; bars 1–3 and 145 are tacet. Chunks follow the 17 section markers in
  4-bar phrases of the 2-bar F–B♭ / A♭–D♭ riff (B C) and the F–B♭ verse figure (E F),
  merging immediate repeats. "b" chunks hold the bar where the riff ends differently
  (12, 44, 100); Post-Chorus a / Chorus 2 b are the "hello" figure (H I). From bar 121 the
  riff has a dead note on A7 and a different fingering (K C), so Chorus 3 and Outro share it.
  Ending: a low F held for four bars. Tempo 113 BPM for the intro, 117 from bar 5, as on the
  record. Fingering: no re-tabs and no overrides. The six shifts of 3 frets (bar 4 twice, 47, 49,
  83, 85) are the F/B♭ at fret 1 against A♭/D♭ at fret 4, and the drop from the E6–E5–E4
  figure back to F on E1. A four-fret span cannot be held in one low-position 1-2-4 box. YouTube: "Nirvana - Topic"
  upload of the album track (5:02 vs 4:58 in the score); the NirvanaVEVO music video is a
  4:38 edit, so it was not used. Sync anchors still needed.
