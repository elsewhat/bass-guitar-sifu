notes: >-
  Standard tuning, 95 BPM throughout, 137 bars (5:46, the album length). The bass part is picked.
  Bars 1–3 are tacet (the guitars alone). Bar 4 holds the bass's pickup fill high on the D and G
  strings, so it starts the first chunk: Band Entrance is 4–8, and its repeat (9–12) repeats bars
  5–8. Intro, verses, solo, pre-chorus and chorus all play one four-bar riff in a few variants: A
  with a C♯–D hammer-on, E and B, a held B, then F♯ down to C♯. One riff per chunk, except the Guitar
  Solo (29–52, the riff six times), in eight-bar chunks. Post-Chorus (85–96): A and E on the open
  strings in a syncopated rhythm. Guitar Madness (97–112) and Outro: A eighths on the open string, E
  with sixteenths, and an E–B figure at position 7. Fade Out: the score's marker is at bar 126; the
  chunks keep the four-bar phrase from bar 125. Bar 137 is tacet. Fingering: 16 re-tabs, all in the
  E–B figure of bars 111–124: B on D 9 instead of A 14, and the low B on E 7 instead of A 2, which
  keeps the figure at position 7. Every riff shifts from position 6 to 2 at its third bar (bars 7,
  11, …), as tabbed. No overrides. YouTube: eZ7MFTBjJS8, "Carry the Zero" by Built To Spill - Topic,
