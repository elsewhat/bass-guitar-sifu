notes: >-
  Drop D (D A D G). A free-time intro with the bass tacet (bars 1–12), then 95–97 BPM with the riff
  in 7/4; the outro slows to 45 BPM (106–113). Also tacet: 48–63 (the interlude and the start of the
  bridge) and 122–124. Chunks follow the 12 section markers; repeated sections are numbered. The
  riff is one 7/4 bar, A–G–C–G–B♭–E; from bar 21 each root rings while a natural harmonic is plucked
  on the A string ("N.H." in the notation; the part has 338 harmonics). Verse and interlude chunks
  are 4 bars, or 5 where a 4/4 bar (33, 38, 47, 96) closes the phrase. Bridge (64–81): an A–E–D
  arpeggio in 4/4 over A, C and D, then B♭. Bridge c–d (82–91): the riff again before Verse 4.
  Chorus: the arpeggios. Outro: a B♭ figure in 4/4, then 2/4 bars as the tempo falls, the A–F–G
  arpeggios and a long D. Fingering: 27 re-tabs. Bars 13–20 move the riff off the low D string: A on
  the open A string, C on A3 and B♭ on A1; the override in bar 13 makes it match bars 14–19, where
  the solver did this by itself. From bar 21 the roots ring under the harmonics, so those notes keep
  the tab: the root on the low D string and the harmonic on the A string, at the same fret an index
  barre (ADR-0007, 2026-11-05). That riff moves through positions 7, 5, 9, 5, 6 and 2 in every bar.
  The arpeggios (64–81, 97–104) stay on the tab: A on low D 7 with E, D and A at fret 7 above it,
  one index barre across the four strings. The importer does not read harmonics: the song data gives
  a harmonic the pitch of the fretted note, and the solver may move it. Override in bar 116: the
  harmonic on A5 stays there (the solver had moved it to the open D string, a different note). The
  other harmonics are on their tab. YouTube: LMCU-lYb0G4, "TOOL - Intension (Audio)" by TOOLVEVO,
  Songsterr's default video for song 56876 (songsterr.com/a/wsa/tool-intension-bass-tab-s56876),
  revision 8507454: 124 anchors for 124 bars, bar 1 at 0:34.19; bars 2, 6 and 12 are far from the
  score's length (×0.76, ×0.83, ×1.35); at most 2.0 s from the tempo map (bar 123). Songsterr's API
  answers 403 to scripts, so the points were read from the tab's page in the browser on 2026-11-06
  and replayed to fetch-video. It plays and embeds from Norway (checked 2026-11-06). Music: offset
  10 ms, the first-sound estimate; the onset match is weak in the last minute (2.32 / 1.22). Lyrics:
  synced from "Maynard J. Keenan | Vocals", 155 syllables from bar 17; lines from the lyrics text.
  To check by ear: the two fingerings of the riff (13–20 against 21 on); the outro's slowing tempo.
