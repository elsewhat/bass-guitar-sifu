notes: >-
  Drop D (D A D G). 145–157 BPM, 4/4 throughout, mostly eighth notes. The bass is Paul D'Amour's
  (Undertow). Rests: bar 1, every other bar in the verses (35, 37, 39, 43, 45, 47, 83, 85, 87, 91,
  93, 95), 149, 189 and 191; the verse chunks keep the stab and rest bars together, so they are 8
  bars. Chunks follow the 13 section markers; repeated sections are numbered. Intro and Intro II:
  two-bar cells of four-string D octave chords (low D, A 5, open D, G 7) and dead notes; Intro II b
  ends with the D♯–C–D chord turn. Verse: two chord stabs every other bar, a held chord in bars 41
  and 89. Pre-chorus: D, F and D♯ (with an A pickup). Chorus: the held D chord, then D♯ and F lines,
  four 4-bar phrases. Bridge (122–148): held D chords; the open D under A, B♭, G and C on the G
  string (frets 12–15); D eighths (142–145) and D octaves. Solo (166–181): a 4-bar D–F–G♯ figure
  four times. Outro: the intro's chords and dead notes, ending on D♯ and D. Fingering: 32 re-tabs,
  among them D2 A5 → D0 in the D eighths (142–145). The chords double D on A5 and the open D string;
  the solver keeps both (ADR-0007, 2026-11-05). No overrides. YouTube: nspxAG12Cpc, "TOOL - Sober
  (Official Video)" by TOOLVEVO, Songsterr's default video for song 19923
  (songsterr.com/a/wsa/tool-sober-bass-tab-s19923), revision 9500451: 191 anchors for 191 bars, bar
  1 at 0:00.03 (×0.52 of its length), at most 0.75 s from the tempo map. Songsterr's API answers 403
  to scripts, so the points were read from the tab's page in the browser on 2026-11-06 and replayed
  to fetch-video. It plays and embeds from Norway (checked 2026-11-06). Music: offset 0 ms, no drift
  (onset match 4.65 / 2.83). Lyrics: synced from "Maynard James Keenan | Vocals", 365 syllables from
  bar 34; lines from the lyrics text.
