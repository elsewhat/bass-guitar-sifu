notes: >-
  C standard tuning (C F B♭ E♭). 169 BPM throughout, the riff written in quarter notes; no
  half/double-time issue (score 4:16; the album track runs 4:38 only because of its radio outro).
  No tacet bars. Chunks follow the 15 section markers; the two "Bridge" markers are numbered 1–2.
  The riff (open C / C octave) is a 1-bar figure, so verse chunks follow the phrase instead: 6
  bars of riff + the 2-bar turnaround (F–G–B♭–E♭ run) are one 8-bar chunk (Intro b, Verse 1 a/d,
  Verse 2 a/d), the 4-bar G/B part and the 4-bar riff + turnaround that answer it are chunks of
  their own. Intro a is the two bars of stabs. Chorus is four different 4-bar phrases (a–d).
  Bridge 1 is three bars of C + the G–A♭–B run, twice, then the run three times (135–137). Bass
  Solo (138–141) and Guitar Solo a–c are the fret-12/14 figure. Break (154–157) and Bridge 2
  (158–161) are both four bars of the plain riff. Outro is the three bars of stabs. Fingering: the
  turnaround's B♭ is played on the open B♭ string instead of the F string fret 5, so the index is
  free for the E♭ that follows at the same fret (no rolling, ADR-0007 rule 6). The solver chose
  that by itself in bars 18, 102 and 165 but kept fret 5 with a one-fret hand move in bars 10, 26,
  70 and 86; the four overrides make the run the same every time. Bar 110 (the run with a doubled
  B♭ into Chorus 2) keeps the fretted B♭. Re-tab accepted: bar 56's G goes from the F string fret
  14 to the B♭ string fret 9, keeping the triplet figure in position 9. The two large shifts (bar
  65 back to the G/C figure, bar 138 up to the solo) are at phrase starts. Double stops are the
  octaves in bars 1–2, 63–64 and 123. YouTube (2026-10-11): Songsterr's default video for this tab,
  "Queens Of The Stone Age - No One Knows (Official Music Video)" by QueensStoneAgeVEVO
  (s88r_q7oufE). Sync anchors are Songsterr's point per bar (song 17108, revision 9405699; npm run
  fetch-video): 180 anchors for 180 bars, bar 1 at 0:00.83, up to 0.8 s from the score's tempo map
  (bar 180). To check by ear: bars whose length in the recording is far from the score: 1 (×1.27).
