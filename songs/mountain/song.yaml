  C♯ standard tuning (C♯ F♯ B E), 125 BPM. Bars 9 and 329 are 2/4 and bar 50 is 3/4. Bars 6–9,
  331–340 and 360 are tacet. 40 dead notes in the groove.
  Songsterr marks this tab AI-generated (song 3133727 "Mountain (C# Standard · With vocals)",
  revision 4114995, "Initial revision"). Its points for AI tabs can sit a quarter or an eighth note
  late (ADR-0029): check the tab ring against the bass by ear.
  No section markers. Intro (1–5). Riff (10–41): A–A♯–B on the F♯ string, E–F–F♯ on the C♯ string
  (frets 3–5), two bars per cell; "turn" ends on C♯–E–C♯–B. Riff from E (59–66, 280–330): the same
  notes from E. C♯ and F♯ descents (67–82): C♯–B–G♯–F♯–E and F♯–E–C♯–B–A. Melody (83–98). F♯ groove
  (107–233): F♯ and E at frets 5 and 3 of the low string with the open C♯, fills up the F♯ string
  (B–C–C♯), and the High F♯ figure (218–233). F♯–E held, E–G♯ and B eighths (234–271). Low C♯
  (272–279) and C♯ eighths to the end (341–359).
