notes: >-
  Standard tuning, 153 BPM, 4/4. Bars 1–18 and 136–137 are tacet.
  Songsterr does not flag the tab as AI-generated, but the revision (song 826753, revision 9683652)
  is described as "regenerated" and every track name ends in "(retranscribed)": treat it as an AI
  transcription, and check the tab ring against the bass by ear (ADR-0029).
  No section markers. Riff a/b: an 8-bar riff of two-bar cells, B–A♯–E, F♯–A♯–B–C♯, D♯–A♯–B and
  F♯–A♯–B–C♯–E, ending E–D♯–B and B–A♯ (b chunks with 5 bars carry that tail). E–D♯ / E–F♯ pulse:
  eighths with sixteenth pickups between the riffs. E–F♯–G♯ climb and F♯ turn (80–89). The break
  (97–112): C run (C in sixteenths, F♯–G–G♯–A up to the high C, then B), C–C♯–D and C–D–E–G climbs.
  E–G♯ / B–G♯ pulse (113–120), A♯–B figure (121–126), Octave climb on G (127–135: G1, G2, G3, then
  B). After the stop: E octaves, B pulse, Walk-up and G♯–A♯–B–E (138–158), the riff again (159–167),
  and the B–E pulse and Outro run (168–194).
  Fingering: 62 re-tabs, mostly to stay in position (C♯3 D11 → G6 in bars 27, 40, 92 and 161; C2 A3
  → E8 in 109; B1 A2 → E7 in 176–180) and the open G in 129–130. Override (bars 86–88): E on A7 and
  D♯ on A6, so the F♯ turn is played A9–A7–A6 like the same figure in the intro (19–20). Bars 80–89
  then stay in position 6, without the 7 shifts of the D-string tab (D4–D2–D1).
