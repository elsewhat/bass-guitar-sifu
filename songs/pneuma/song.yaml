notes: >-
  Drop D (D A D G). 110–117 BPM (the last bar at 50). Bars 1–35 (the intro) and 317–328 (the break)
  are tacet; bar 36 holds only the pickup into Bass Enter. The tab's "Bass Delay FX" track (752
  notes) is not imported. Chunks follow the 16 section markers; repeated sections are numbered. The
  riff is a six-bar cycle (6/8 6/8 5/8 6/8 5/8 5/8, 33 eighths) of dyads high on the D and G strings:
  D with A, B♭, G, F, E and the D octave. Bass Enter is one cycle and its repeat; later sections take
  two cycles per chunk (12 bars, about 18 s). Band Enter b and Chorus b are the four-bar F variant
  (6/8 6/8 5/8 8/8); Chorus c ends on a held D octave. Interlude and Solo: a two-bar F–E–C–E–D
  figure on the low strings. Legato Interlude and Chorus 3: the riff with the dyads held. Bridge
  (221–316): a held D (a), the A–F–D figure in the upper octave (b–e, with fills in 252, 266 and
  268), in the low octave (f–h), then in eighths (i–j) and sixteenths (k–n). Climax: a 5/8 7/8 5/8
  7/8 5/8 4/8 cycle on D, F and C. Outro: D, F and C held, ending on C. Fingering: 50 re-tabs, mostly
  A1 D7 → A0 and F2 D15 → D3 in the bridge. The riff is tabbed high: D on D12 with the upper note on
  G12–G15 (position 12), down to positions 9 and 7 at the end of the cycle. Overrides: bars 307–315,
  the A on the open A string as in bars 269–306 (the solver kept low D 7 there because an F follows).
  Bars 307–314 still move to position 6 for the F on A8, as tabbed. YouTube: not set. Songsterr's API
  answered 403 to npm run fetch-video on 2026-11-05. The owner named the tab: song 455388
  (songsterr.com/a/wsa/tool-pneuma-bass-tab-s455388); run npm run fetch-video -- pneuma --song
  455388, then with --write. Music: offset 10 ms, the first-sound estimate; the onset match is weak
  in the last minute (1.87 / 1.47). Lyrics: synced from "Maynard James Keenan | Vocals", 153
  syllables from bar 70; lines from the lyrics text. To check by ear: the two-cycle chunks (12
  bars); the Music offset.
