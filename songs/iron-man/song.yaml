notes: >-
  Standard tuning. The tempo map follows the recording (the "slow tempo" warning is the 65 BPM
  intro, not half time): the main riff is quarters, eighths and a 16th-note G–F♯ trill at
  72–76 BPM; bars 61–84 (Transition, Solo 1) run at 168 BPM and bars 103–149 at 158 BPM. Bars
  1–9 are tacet (feedback, drums and "I am Iron Man"); the bass enters in bar 10 with a fast
  chromatic run from E15 down to E8 (64th notes, effectively a slide, hence the 12 → 8 shift)
  that leads into the riff, so Intro is 10–12 with the first riff (the 2-bar Pre-Verse marker).
  Chunks follow the 23 section markers; repeated markers are numbered (Pre-Verse 2–5, Bridge
  1–2, Break 1–2, Transition 1–2). Bars 11–22, 29–36, 45–52 and 89–96 are all the same 2-bar
  riff; Pre-Verse 2 (17–18) is kept as its own 2-bar chunk so the verse chunks start on the
  marker. Segue (104–116) is 13 bars of 16th-note E (A7) pedal, split 5 + 8. Interlude, Solo 2
  and Outro are the E–D–C♯–C descent on the A string in 4-bar phrases; bars 144 and 148 end on
  the B–G–F♯–G–B turnaround and Outro c (145–149) includes the final hit. Overrides: in each
  second riff bar (the G–F♯ trill) the solver started the trill with the index on D5 at
  position 5 and shifted to position 4 on the second 16th; the overrides put the G under the
  middle finger so the hand moves to position 4 on the long E before the bar line and the whole
  trill, D and E stay in one position (same number of shifts, none inside the 16ths). The end of
  each riff then slides the middle finger from A5 to A7 (position 6) and returns to position 5
  for the B on E7, which keeps rule 5 (1-2-4 box below fret 5) and avoids rolling the little
  finger from A7 to E7. YouTube: "Iron Man (2012 Remaster)" on Black Sabbath - Topic (5:54, same
  as the score). The official "Iron Man" music video linked from blacksabbath.com (5s7_WbiR79E)
  is no longer available. Sync anchors still needed.
