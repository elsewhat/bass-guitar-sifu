notes: >-
  Standard tuning, 163 BPM throughout, no tacet bars. Title casing follows the album ("in").
  Chunks follow the 10 section markers; the three "Chorus" markers are numbered 1–3 here.
  Intro, verses and solo share one 2-bar riff (E on A7, open E, G#+D double stop); its
  4-bar variants (ABAC, ABAD) get their own chunks and runs of the plain riff are merged
  (Verse 1 a ×3, Verse 2 c ×3). Each chorus is a sparse E–G–A figure with long held notes, so
  its chunks follow the two phrases (7 and 8 bars, the last chorus 7 + 4) instead of 4-bar
  splits that would be only held notes. Interlude a (122–127) is one held open E; Interlude b
  is the A7 eighth-note pulse. From bar 132 to 203 the bass plays one 2-bar riff for 72 bars
  across Interlude, Bridge and Outro: chunked in 8-bar phrases, with repeats merged up to the
  16-bar limit, so "Outro a repeat" (196–203) continues the same riff. Outro b–d are the ending
  (A7 + open-E eighths, then the A5–A7 grace figure and the final E). Fingering: the solver
  alternates positions 5 and 6 on the repeated riff (A7 with the little or the middle finger)
  so the finger that played G7 never rolls across to A7 at the same fret (ADR-0007 rule 6);
  accepted, no overrides, no re-tabs. YouTube (2026-10-11): Songsterr's default video for this tab,
  "Rage Against The Machine - Bullet In The Head [HQ]" by Knallkopf105 (S8YsF-sBf0Q). Sync anchors
  are Songsterr's point per bar (song 9511, revision 9281770; npm run fetch-video): 214 anchors for
  214 bars, bar 1 at 0:00.00, up to 7.9 s from the score's tempo map (bar 214). To check by ear:
  bars whose length in the recording is far from the score: 169 (×1.24).
