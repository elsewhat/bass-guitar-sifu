notes: >-
  C♯ standard (C♯ F♯ B E), 122 BPM, 4/4, 577 bars (18:55). Tacet: 31–55, 91–100, 491–500,
  506–510, 517, 571–577. No section markers; names describe the bass. Main riff: the two-bar
  C♯ riff on F♯7/E9/B7–9 (bars 1–16, 56–64, 89–90, 501–505; 511–516 is a pushed variant).
  "Verse" chunks are the same riff where the file's Vocals track sings (65–80, 101–112).
  Chord walk: F♯–C♯–F♯/E♭/B–B–F♯/A♭/E–E–E♭/E/F♯–F♯/B/B♭, 8 bars (a = first 4, b = last 4),
  instrumental at 81–88 and with vocals from 113. 147–169 is the bridge into the jam (open-C♯
  pedal, high F♯/B lick, C♯–E–E♭ steps, arpeggios). 170–490 is the long C♯ pedal jam: C♯ on
  F♯7 with B (F♯5) pickups; "×N" chunks merge N repeats of the 4-bar groove; the variations are
  called out as Groove fill (277), C♯ eighths (straight-eighth bars), Groove pushes (411–429)
  and Stop-time (457–485), ending on a held open C♯. 530–570 is the outro: run-up, licks, a
  descending coda riff and a final held C♯ (565–570; 566–570 are ties only).
  Fingering: no overrides; 60 re-tabs accepted (open F♯/B/E strings for C♯5/F♯5/B5 pickups so
  the hand can move, E on F♯10 → B5 at bar 85, E on B5 → F♯10 at 108, E♭ F♯9 → B4 at 556).
  Two solver limitations to check: (1) the main riff moves between positions 6 and 7 because
  F♯7→B7 and E7→F♯7 at the same fret count as index-finger rolls (ADR-0007 rule 6);
  (2) the high B12–B11–F♯12 cell in bars 120, 128, 136 and 168–169 flips between positions 9/10
  and 10/11 every few notes for the same reason. A teacher would stack ring and little finger on
  fret 12, which the box model cannot express; no override was added. The jam groove uses index
  (F♯5) and little finger (F♯7) in position 5 (1-2-4 box, rule 5). Large shifts: bar 19–20 (E12–
  E16 fill), 141 (C♯7 → C♯3), 156 and 542 (down from the high lick).
  Duration: the score runs 18:55 at a constant 122 BPM, but the studio recording is 16:58, so
  either the record is faster (about 136 BPM if the form matches) or the transcription's jam
  is longer; check by ear before tapping sync anchors. YouTube: "The Wheel" on
  "Motorpsycho - Topic" (Timothy's Monster, 1994).
