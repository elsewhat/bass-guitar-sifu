notes: >-
  Transcribed from the recording by analysis (ADR-0030, 2026-10-12), not by ear and not from a tab:
  no tab of this version exists. Expect wrong notes and check by ear.
  The recording: Roadwork Vol. 1 (live in Europe 1998), track 5, the MC5 song, the upload "Black to
  Comm (Live)" by Motorpsycho - Topic (szWEif9dPQk).
  Method: drums and vocals removed with Demucs; the lowest voice read per eighth note on a beat grid
  tracked in the recording; bars that sound alike vote together; the octave is the lower one when
  its fundamental is in the sound.
  The song: 171 bars, standard tuning. One figure throughout: seven eighth notes on D (A string fret
  5, or the open D string) and a C on the last eighth, hammered back to D on the next downbeat. Bars
  1–10 are the guitar alone (bar 1 is a 3/8 pickup). From about bar 82 to 129 the drums are out and
  the figure goes on. Some bars are read as eight Ds; whether the C is really missing there is not
  known. Bars 161–171 are the ending: the readings between the D bars are noise from the freak-out,
  not notes to learn.
  YouTube: the sync anchors are the bar starts measured in the recording (ADR-0029), not Songsterr
  points. Do not run fetch-video --write for this song.
  To check by ear: whether the C comes on the last eighth of every bar, and whether there is a C
  sharp on the way down to it (the tracker read one in many bars; it is not written).
