notes: >-
  Standard tuning. The score includes Luke's Wall (bars 119–127), as on the US album track "War
  Pigs / Luke's Wall"; 7:57 in the score vs 7:55 for the YouTube upload, so the tempo map
  follows the recording. The slow-tempo warning comes from the 12/8 intro (bars 1–8, 56 BPM);
  from bar 9 the song is 4/4 at 90 BPM (94/89 around bars 136–137, 106 at 165 and 152 from 166
  for the speed-up), so no half/double-time note. Repeats unrolled (written 9–10 and 89–90 are
  played twice): bar numbers are played bars. Bars 9–28 and 91–110 are the sparse E stabs: one
  bar played, one bar rest. Those single rest bars stay inside 4-bar chunks so a loop keeps the
  stab/rest rhythm; bars 12, 28, 94 and 110 are trailing rests of their phrase. Intro c (9–12)
  and Pre-Verse (91–94) are the same stab figure as the verses but sit under their own section
  markers. Section markers with the same name are numbered (Interlude 1–4, Guitar Solo 1–2);
  "SPEED" (165–167) is named Speed-up. Interlude 1 c (37–40) and Interlude 2 (49–52) are the same
  two-bar figure ×2; Bridge Part 1 and 2 (41–60) are one one-bar riff ×8 each. Luke's Wall is
  split 119–122 / 123–127 (the 5-bar b ends on the bar before Interlude 4). Interlude 4 c
  (136–137) is the slower two-bar lead-in to the second solo. Re-tabs accepted: the D on A5 is
  played as open D in bars 33, 61, 65, 79, 115, 132–133 and 143, and the G on D5 as open G in
  bar 134, so the hand keeps its position across the riff (same simplification as in Paranoid).
  The one large shift (bar 137, position 2 → 5) is the move into the second solo and is
  inherent. No overrides. Lyrics are synced from the Ozzy Osbourne vocal track. YouTube
  (2026-10-11): Songsterr's default video for this tab, "Black Sabbath - War Pigs (440 Hz - Standard
  tuning)" by Manuel García Miranda (Y6jGEXS3I58). Sync anchors are Songsterr's point per bar (song
  10137, revision 8782092; npm run fetch-video): 169 anchors for 169 bars, bar 1 at 0:00.90, up to
  2.3 s from the score's tempo map (bar 169). To check by ear: bars whose length in the recording is
  far from the score: 167 (×0.83), 168 (×0.50).
