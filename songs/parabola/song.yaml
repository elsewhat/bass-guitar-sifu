notes: >-
  Tuning B E D G (MIDI 23, 28, 38, 43), as in the tab: the low string a fourth below E and the
  second string down to E; the guitar track has the same two low strings. 85–120 BPM with 67 tempo
  changes; 6/4, 7/8, 2/4, 8/4 and 12/4 bars. Bars 129–131 are tacet. Chunks follow the 18 section
  markers; repeated sections are numbered. The main riff (1–16, 25–31, 53–59) is a one-bar E figure
  with the E/D double stop, ending D–B; 4-bar chunks. Pre-Chorus: G5 and A5 dyads, then E under B
  and C♯, in two-bar cells. Post-Chorus: the B–D–A–E figure; 1 b and the Guitar Solo the low E–F–G
  figure. Bridge 1 (6/4): an E pedal under the G–F♯–A–D melody on the G string (frets 12–19). Bridge
  Verse: the melody and the A–D–G line. Interlude 1: E/D and G–A figures. Bridge 2: the E–A–G–D
  line; c the run in 7/8, 4/4, 7/8 and 2/4; d the E–D riff. Outro Verse: a dead-note groove. Outro:
  long B and E notes in 8/4 bars, ending on an E held into Outro 2. Fingering: 17 re-tabs (G1 B8 →
  E3 in 24, 37–44 and 52; E1 B5 → E0 in 87, 89, 91 and 104). No overrides. YouTube: -DuAAmHpGbw,
