notes: >-
  Standard tuning. Chunks follow the 9 section markers, split into 4-bar phrases; the three
  "Chorus" markers are numbered 1–3 here. Bar 78 is tacet. Intro (1–8) is the 16th-note
  open-string figure in 2-bar units (the last bar of each chunk varies). Main Riff and every
  Chorus are the same 2-bar riff with the sliding B5–A5 power chords (47 double stops,
  index + little finger); Main Riff b and Chorus 1 b end on a held chord (17 and 41–42),
  Chorus 3 b ends with the final descent in bar 77. Verse 1 is 16 bars of the same 2-bar
  riff (18–25 = 26–33), split into four 4-bar chunks; bars 25 and 33 end with a rest.
  Bridge a (59–60) is open-E 16ths into the E octave on A7; Bridge b and Solo are the same
  2-bar figure. Override: bar 60 A7 (six 16ths and an eighth after open E) is pinned to the
  index finger in position 7. The solver chose the little finger in position 5 only to make
  the jump back to fret 2 in bar 61 two frets shorter; hammering repeated 16ths with the
  little finger is what a teacher would avoid (sparse passage, rule 2), and the open E before
  it gives the hand time to move. No re-tabs. YouTube: official video on RATMVEVO (4:04 vs
  4:06 in the score); sync anchors still needed.
