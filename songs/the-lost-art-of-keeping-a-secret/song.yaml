notes: >-
  C standard tuning (C F B♭ E♭). 112 BPM, eighth notes; no half/double-time issue (score 3:39,
  album track 3:36). Bar 1 is a 5/16 pickup bar without bass (tacet); everything else is 4/4.
  Chunks follow the 10 section markers in 4-bar phrases; the three "Chorus" markers are numbered
  1–3. The verse riff is C–G–F♯–F with a B♭–C tag at the end of each bar; Verse 1 b, Verse 2 b and
  Solo b are the phrases with fills (bars 14, 17, 41, 78–79). Chorus is C–G–F♯–E♭ an octave lower;
  Chorus 2 b and Chorus 3 b are the chromatic variant C–F♯–E♭–D/C♯. Bridge is F♯ F♯ A♭ A♭ (a), the
  C bar and the C–B♭ trill (b, 2 bars), then F♯ F♯ A♭ A♭ again (c). Outro is a 1-bar figure four
  times; Ending is the held open C. Fingering: the solver moved bars 92–93 (Chorus 3 b repeat) to
  first position (C on the B♭ string fret 2, F♯ on the F string fret 1) because the hand ends bar
  91 at fret 1, while bars 54–57 and 88–91 play the same four bars on the source tab (F7, C6, then
  down to frets 3–1). Two overrides keep 92–93 on the source tab so the repeat is fingered like
  the first time. Remove them if the first-position version feels better. No re-tabs remain. The
  shifts of 3+ frets are the descents inside the chorus (fret 6 to fret 3) and the two high fills
  (bars 17 and 79, up to frets 10–14). YouTube: the owner asked for the video Songsterr uses; its
  default for this tab is a third-party upload ("Vinyl Rip", channel d0rky, 3:35), not an official
