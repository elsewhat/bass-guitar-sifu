notes: >-
  D standard (D G C F). Bass enters at the end of bar 5 with a 3-note pickup into the riff, so
  bar 5 is merged with the "Band Entrance" (6–9) into Intro; bars 1–4 and 112 are tacet. The
  2-bar main riff (B C) starts on even bars; chunks are 4 bars of it, merging immediate repeats,
  with "b" chunks for the bar where the riff ends differently (25, 41, 77). The "Outro
  (Refrain)" marker plays the main riff, so it is named Outro. Ending: one note, then a G held
  for five bars. Fingering: the solver re-tabbed the refrain G in bars 27 and 29 from D5 to the
  open G string, but kept D5 (little finger, position 3) in bar 31 and in the identical E–G
  figure of both pre-choruses. The overrides pin bars 27 and 29 to the source D5 with the
  little finger so the refrain and pre-chorus are played the same way throughout. The shift at
  bar 33 (position 2 → 5) leads into the verse riff and is in the source tab. The main riff is
  fingered 1-2-3 (position 7) in the intro and verse 1 and 2-3-4 (position 6) from verse 2 on,
  because the solver slides in from below; both are valid under the rules. YouTube: official
  HD music video on NirvanaVEVO (3:44 vs 3:43 in the score); sync anchors still needed.
