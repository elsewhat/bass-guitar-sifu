notes: >-
  A further copy of Vortex Surfer (ADR-0029): the live take on Roadwork Vol. 1 (live in Europe
  1998), track 7, the upload "Vortex Surfer (Live)" by Motorpsycho - Topic (rFqaa8PWC_I). The others
  are songs/vortex-surfer (the studio take), vortex-surfer-from-the-start and vortex-surfer-
  retranscribed.
  Transcribed from the recording by analysis (ADR-0030, 2026-10-12), not by ear and not from a tab.
  Method: drums and vocals removed with Demucs; the lowest voice read per eighth note on a beat grid
  tracked in the recording.
  The song: 224 bars, standard tuning, the same chord order as the studio take. Bars 1–116 (to
  4:11): as in the studio take nothing sounds below 80 Hz, so there is no bass line of its own; the
  lowest voice is written as one whole note per bar at the pitch it sounds (B, A, E, G on the D and
  G strings). That is an arrangement, as in vortex-surfer-from-the-start, and it has that copy's
  root in every bar: B B A A E E E E six times (2–49), G G A A B B B B G G A A and eight bars of B
  (50–69), four more cycles (70–101), G G A A B B B B G G and five bars of A (102–116).
  From bar 117 (4:11) the bass plays the root in eighth notes, two bars per root, as in the studio
  tab from its bar 130: Riff A 117–128 (B♭ G D D three times), Climb 129–134 (B♭ C B B A A), E pedal
  135–146, Descent 147–164, a break without bass 165–179, Return 180–195, Rise 196–207, Half-step
  208–219, Outro 220–224 (B♭, G, then D held). The chunk names are those of songs/vortex-surfer; the
  bar numbers are 13 lower here up to the break.
  Bar lines: bar 1 is a quarter-note pickup, bar 116 is 3/4 and bar 179 is 2/4. The band comes in
  after both stops without counting, so the grid jumps there. The recording goes on to 9:14 with
  feedback; the score ends at 8:00.
  Every eighth note in the loud part is written as struck; the root of each bar was read from the
  recording and agrees with the studio tab's order everywhere. Rhythmic variations are not written.
  Strings (owner, 2026-10-13): the loud part is tabbed as vortex-surfer-from-the-start shows it. D
  is fret 5 of the A string, not the open D string (Riff A and the Outro). B♭ is fret 6 of the E
  string where Riff A repeats (bars 121 and 125). A is fret 5 of the E string in the Descent
  (149–150, 157–158) and in the first A of the last Rise (198–199). These are the place entries in
  scripts/transcribe/songs/vortex-surfer-live.json. String, fret, finger and position now agree with
  that copy in every bar the two share; the rhythm is still the live take's (eighth notes in
  163–164 and 220–221, D struck in each of 222–224).
  YouTube: the sync anchors are the bar starts measured in the recording (ADR-0029). Do not run
  fetch-video --write for this song.
  To check by ear: the tab ring on the first B♭ at 4:11 and on the first B after the break at 6:25,
  and whether you want the first four minutes at all.
