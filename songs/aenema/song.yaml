notes: >-
  Drop D (D A D G). 12/8 at 180–186 BPM to bar 67, then 6/8 at 87–95 BPM with notes half as long:
  the same speed (see tempo.note). Bars 1–4 and 199 are tacet. The bass track's name has no "bass"
  in it, so bassTrack names it. Chunks follow the 16 section markers; repeated sections are
  numbered. Intro: E–D on the low string with the D octave. Verse 1: E5 and G5 dyads against the
  open D. Pre-Chorus: E and G on the low string against the low D; 1 b ends with the C–D climb, 2 b
  (49–52) is E, D and C in the upper octave (frets 10–16) and the D/A chord bar. Chorus: E with dead
  notes and turns on G, F and C–D. Post-Chorus 1: A eighths; Post-Chorus 2: D/E and C–D cells.
  Bridge (68–83): E–D sixteenths, 16 bars. Bridge II and III: E and G in sixteenth sextuplets, four
  bars each. Guitar Solo: the E figure with a run up, G5 dyads and a run down, twice. Pre-Climax:
  the G A C B / B A G A melody in the upper octave, ending on a held F♯. Climax: E–D and G–D
  sextuplets and the B5 dyad. Outro: the D–D–G♯–D chord, held, then stabbed. Fingering: 32 re-tabs,
  mostly D2 D12 → D0 and C2 D10 → A3 in the chorus turns. No overrides. YouTube: rHcmnowjfrQ, "TOOL
  - Ænema (Official Audio)" by TOOLVEVO, Songsterr's default video for song 23339
  (songsterr.com/a/wsa/tool-nema-bass-tab-s23339), revision 7763177: 199 anchors for 199 bars, bar 1
  at 0:06.91, at most 1.4 s from the tempo map (bar 153). Songsterr's API answers 403 to scripts, so
  the points were read from the tab's page in the browser on 2026-11-06 and replayed to fetch-video.
  It plays and embeds from Norway (checked 2026-11-06). Music: offset 10 ms, the first-sound
  estimate; the onset match is weak (1.27 in the first minute, 140 ms at 1.15 in the last). Lyrics:
  synced from "Maynard J. Keenan - Vocals", 556 syllables from bar 9; lines cut by timing. To check
  by ear: the Music offset. The metronome counts every notated eighth: 12 counts a bar to bar 67,
  then 6 a bar of the same length.
