notes: >-
  Standard tuning. Bars 1–3 and 108 (2/4) are tacet; bar 4 holds only the E pickup on beat 4
  (E string fret 12) and is kept with the first intro phrase, so Intro a is 5 bars. The whole
  song is the E–C–G–F# (Em–C–G–D) progression in 4-bar phrases, one root per bar in eighths,
  so chunks follow the 12 section markers in 4-bar units; the two "Chorus" markers are
  numbered 1–2 here. From bar 73 the C bar ends with an A on the E string (fret 5) leading
  into G; Breakdown and Outro a are a 2-bar E–C figure ending with an A–G turn. Fingering:
  G (E string fret 3) takes the middle finger in position 2 after C (A string fret 3) so the
  index does not roll across strings at the same fret, and the index in position 3 after the
  A on fret 5; both are 1-fret moves. No re-tabs, no shifts of 3+ frets, no overrides.
