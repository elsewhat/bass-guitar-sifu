notes: >-
  Standard tuning, 117 BPM throughout, matching the recording (no half/double-time issue).
  Title casing follows the album ("the"). Tacet: 13, 93, 97, 101 and 105–106. The main riff is a
  4-bar phrase starting at the section markers (C♯ C♯ E E, the fourth bar ending in the
  C♯–E♭–C♯–B–G♯ fill). Bar 1 is a 2¼-beat pickup playing that same fill before the "Intro"
  marker at bar 2, so it is merged into Intro a (1–5); Intro b (6–9) is the riff alone and Intro c
  (10–12) stops before the tacet bar 13. The "Verse I"/"Verse II" markers are numbered 1–2 here.
  Verse 1 b ends (bar 33) with the G♯ (E16) – open E pickup into the chorus. Chorus is an 8-bar
  phrase (34–41) played twice, split in 4-bar halves; Chorus 1 c = Chorus 1 a, and Chorus 2 is
  the 8-bar phrase once, its last bar (77) leading into the bridge. In bar 69 the chorus pickup is written in voice 2, which the importer
  skips, so Verse 2 b ends without it. Bridge (78–92) is the E–B octave/F♯ figure in position
  7 with the C♯ and A bars. Outro is Bridge d (90–92) three times, each followed
  by a rest bar; Outro ×2 (98–104) keeps the rest bar 101 inside the loop. Re-tabs accepted: the
  B in the riff fill moves D9 → A14 and the F♯ D16 → G11 so the whole riff stays in position 11,
  the A on E5 becomes the open A (chorus bars 40, 48, 76 under the D on A5, and bridge bars 85,
  89), and in the bar 77 fill the E♭ moves D13 → G8 so the fill stays in position 8. Shifts of
  3+ frets (bars 38, 46, 74: up to the E–F♯ octave figure; bar 81: C♯ down to A) are inherent
  to the line. No overrides. YouTube (2026-10-11): Songsterr's default video for this tab, "Tame
  Impala - The Less I Know The Better (Audio)" by tameimpalaVEVO (2SUwOgmvzK4). Sync anchors are
  Songsterr's point per bar (song 411169, revision 6915570; npm run fetch-video): 106 anchors for
  106 bars, bar 1 at 0:00.25, up to 0.5 s from the score's tempo map (bar 94). To check by ear: bars
  whose length in the recording is far from the score: 1 (×1.44).
