notes: >-
  Transcribed from the recording by analysis (ADR-0030, 2026-10-12), not by ear and not from a tab:
  no tab of this suite exists. Expect wrong notes and check by ear.
  The recording: Roadwork Vol. 1 (live in Europe 1998), track 2 (30:47): Un Chien d'Espace with
  Astral Travelling and other parts inside it, the upload "A K9 Suite (Live)" by Motorpsycho - Topic
  (_r-DQCzz6Oo). The library's Un Chien d'Espace (songs/un-chien-d-espace) is the studio take.
  Method: drums and vocals removed with Demucs; the lowest voice read per eighth note on a beat grid
  tracked in the recording; bars that sound alike vote together, so small variations between repeats
  are smoothed away.
  The suite: 752 bars, standard tuning. Bars 1–42 (to 1:51) are the quiet opening without bass.
  43–141 (to 6:00) is the first Un Chien d'Espace part, as in the studio tab: C in eighth notes (A
  string fret 3), the figure on low F rising to G, the walk down E♭, D, C♯ to C, a quiet repeat with
  long notes from bar 92, and loud C again from 116. 142–361 (6:00–15:00) is the long quiet middle:
  a C drone, written as one whole note per bar; what the bass really plays there, if anything, could
  not be read. 362–664 (15:00–26:10) builds on C from near silence to full volume and from 97 to 119
  BPM; it is written as C in eighth notes, which is the pulse but not the detail. 665–712 is quiet
  again (C, F, G), 713–752 the loud ending on C.
  Octaves: a C an octave below the bass's lowest string sounds through much of the suite (bass
  pedals, most likely). It is written an octave up, as the C on the A string.
  Bar lines: bar 1 is a quarter-note pickup. The quiet parts have no steady pulse, so their bars are
  only a grid; in the loud parts the chord changes fall on the bar lines, with the G in the F–G
  figure a quarter note early, as it is played.
  YouTube: the sync anchors are the bar starts measured in the recording (ADR-0029), not Songsterr
  points. Do not run fetch-video --write for this song.
  To check by ear: the figure on F and G (60–63, 68–71), the walk down (79–83), and how much of the
  eighth-note C in the long build you want to play.
