notes: >-
  Chunks are the design acceptance fixture (reference/vortex-surfer-chunks.json). Bass enters
  at bar 130; bars 1–129, 177–191 and 241–243 are tacet. Bars 234–240 hold one tied D and
  belong to the Outro. The tab is an AI transcription on Songsterr (song 2582753, revision 3403501,
  its only revision); no transcription by a person was found anywhere (2026-10-11). Its notes hold up
  against the recording: the root of every bar from 130 on is the one heard. YouTube (2026-10-11):
  Songsterr's default video for this tab, "Motorpsycho - Vortex Surfer" by Overdrive Arcade
  (ENZaFo2cEog). The sync anchors are NOT Songsterr's points (ADR-0029). Those put every bar a
  quarter note late up to bar 176 and an eighth late from bar 192, so the tab trailed the video by
  0.55 s and 0.27 s. The anchors are the bar starts measured in the recording: an eighth-note grid
  tracked from its onsets, with the bars placed on the chord changes. Against the bass's pitch
  changes in the recording they are within about 30 ms. Do not run fetch-video --write for this song;
  it would bring the late points back. Bar 1 is shortened: the first full bar starts 1.48 s into the
  video. The official upload, "Vortex Surfer" by Motorpsycho - Topic (ENCBJU-xHcA), has the same
  audio 349 ms earlier: subtract 349 from every anchor to use it. Music (2026-10-11): the inbox MP3
  dated 09-29-2026 is rendered from this score (110 BPM, 243 bars), not from the retranscription it
  arrived with (107 BPM). First sound 3 ms after the first note, last minute at 0 ms; the onset match
  in the first minute is weak. Copies of this song for comparison: vortex-surfer-from-the-start and
  vortex-surfer-retranscribed. To check by ear: the tab ring on the bass with YouTube from bar 130
  and again from bar 192, and the Music offset.
lyrics:
  # Pasted by the owner (Motorpsycho's shared lyrics, motorpsycho.fix.no); unsynced, ADR-0024.
  text: |
    And if she said so
    That would change it all
    If she said so
    I would cushion her fall
    And if it felt right,
    She'd let me know the plan
    Take my hand
    And explain to me so i could understand
    Why she said so

    If she said so
    It would be too much like death
    If she said so
    I would eat her breath
    If she said so
    I'd know all the lies
    But i'd wipe out white
    And never even ask the reason why
    She said so

    And never end
    Go back to start
    And never say
    When i fall apart
    And never stoop
    To complain
    About the pain
