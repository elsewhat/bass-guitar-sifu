notes: >-
  The score repeats written bar 98 six times (|: :| x6), so it is unrolled (ADR-0023): 105 written
  bars become 110 played bars, and every bar number here is a played bar. Played 1–97 = written
  1–97, played 98–103 = written 98 ×6, played 104–110 = written 99–105.
  Bars 32, 58 and 71 are 2/4 rest bars before the refrains and the third verse.
  The verse riff (Verse 2, Verse 3) is one bar played over and over, so those chunks are split in
  4-bar phrases; Verse 2 has 11 bars, so its repeat chunk has 7.
  Refrain b climbs to position 14 for the 3/8 fill in bars 43–44.
  Bars 89–90 (Outro marker) only hold the open D of bar 88, so they end Refrain 2 d.
  The Outro riff (D0 D3 D5 D6 A0 A3 A4 A5) is 14 bars, split 7 + 7. Its G♯ on D6 takes a small
  shift up from the 1-2-4 box at position 3, and the open A that follows gives time to shift back.
  Outro end: the last riff bar into the D5 chords (40 BPM) and the held D.
  YouTube: the official video on RATMVEVO; it may have extra footage around the song. The album
  track is on the Topic channel as 7pAr6B7fqyM if the video's timing turns out not to fit.
