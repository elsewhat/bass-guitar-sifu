  score's tempo map (bar 108).
lyrics:
  # Pasted by the owner (Motorpsycho's shared lyrics, motorpsycho.fix.no); unsynced, ADR-0024.
  text: |
    you took my hand in yours
    fed me lies and locked the doors
    showed me truths I never saw
    I can’t belive them anymore
    now I’m looking through you
    oh,yeah..

    you suck the will from my soul
    leave me naked in the cold
    tie the noose around my neck
    can’t yousee I’m not dead yet
    but I’m working on it
    wearing yr smell

    fading from myself
    feeling sorry for myself
    feeding the pity inside
    the pathetic feelings I should hide
    but I’m thriving on it
    yes,I’m thriving on it
    wearing yr smell

    fadeing
    feeling
    feeding
