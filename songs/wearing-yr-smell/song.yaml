notes: >-
  Standard tuning, 137 BPM, 4/4 throughout; bars 1 and 120 are tacet. No section markers, so
  chunks are named by what the bass does, and names repeat for the same material:
  Intro climb (E–F♯–G–A–B up the A string, then B–C♯–D–E up the D string; the same climb
  returns as Outro climb 116–119); Riff A (G, D, then the B–D–E–D figure on E7/A5/A7);
  B pedal (B on D9 for two bars, then D and the riff figure); High line a/b (G pedal, D–C♯–E up
  high, then G–F♯–G–A down to D); Long climb (E up the A string to D/E, landing on a D pedal);
  Low bridge (held A, F♯, G, D on the E and A strings); Low G (G pedal, in 110–115 with E–F♯–G
  pickups). Riff A at 32–35 and B pedal repeat at 44–47 are slight variants of the first
  occurrences; High line b repeat (94–97) ends on a longer D. Return (80–85, 6 bars) is D,
  riff figure, B pedal, D, riff figure back into the High line.
  Fingering review (139 re-tabs, all accepted, no overrides): (1) most are the low D, G or A
  moved from A5/D5/E5 to the open string, either to avoid rolling the index across strings at
  the same fret (bars 24, 32, 48, 54, 86: G and D alternating on D5/A5) or to give the hand time
  to come down from positions 6–12 on a held note (bars 18, 22, 38–46, 62–63, 72–73, 96–97,
  106–107, 118–119); (2) bar 4–5 B on A14 → D9 keeps the intro climb in position 9 before it
  continues up the D string; (3) bar 51 C♯/E on D11/D14 → G6/G9 stays in position 6 after the
  D on G7; (4) bars 56–58 the held G on A10 → open G string in the middle of the long A-string
  climb (a break to shift to position 12; play A10 if you prefer the fretted tone); (5) bar 91
  open D → A5 to stay in position 5 for the next bar. Bars 11/15/35 (B on A2, D on A5) use
  index and little finger with a one-fret pivot (1-2-4 box, ADR-0007 rule 5).
