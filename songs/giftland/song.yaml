notes: >-
  Drop C♯ tuning (C♯ A♭ C♯ F♯: E♭ standard with the low string down to C♯), 155 BPM, 100 BPM from
  bar 397. Bars 1–85, 121–141 and 177 are tacet. 830 triplet eighths (232–255 and 309–372) and 54
  double stops (C♯ octaves in 100–106, fifths in 316–324).
  Songsterr marks this tab AI-generated (song 6028149, revision 7872780, "Initial revision"). Its
  points for AI tabs can sit a quarter or an eighth note late (ADR-0029): check the tab ring against
  the bass by ear.
  No section markers. C♯–A♯–B (86–99, 212–227): long notes, two bars each. Octave dyads (100–107).
  C♯ octaves and Turn (108–115, 180–211): C♯ held, then the low C♯, and A–G♯–F♯–B–A♯–B. Low C♯
  (142–169): the low string held under the second verse. Triplet part (232–257): B–C♯, C♯, F♯, E.
  Descent (258–266): B–A♯–G♯–F♯–E–D♯. F♯ halves, offbeats, E–G♯–B–F♯ and Melody (273–308). Fifths
  (316–324). F♯–E–G♯ cycle (325–372): F♯ four bars, E two, G♯ two, in triplets. High B–C♯ (373–377).
  Held C♯ (385–396). Slow C♯–A♯–B (397–404) at 100 BPM.
  Fingering: 168 re-tabs, no overrides. Most move a note from fret 5 of one string to the open
  string above (C♯2 A♭5 → the open C♯ string, F♯2 C♯5 → open F♯, A♭1 C♯7 → open A♭). Shifts of 3+
  frets only at chunk changes.
  YouTube (2026-10-30): Songsterr's default video, "Motorpsycho - Giftland" by Overdrive Arcade
  (-8u6xe60TZY), a third-party upload. Sync: 404 anchors for 404 bars, bar 1 at 0:00.11. The tab has
  one tempo, but Songsterr's points put the recording at about 171 BPM in bars 86–230, 119 in
  231–258, 153 in 259–312, 226 in 313–367, 118 in 368–384, 156 in 385–396 and 96 from 397: 34 s
  ahead of the tempo map at bar 368. With YouTube the tab follows those points; the Metronome, Synth
  and Music follow the tab's 155.
  Music: offset 6 ms, the first-sound estimate; the onset match is weak (2.2 / 1.4), drift unknown.
  Lyrics: synced from "Vocals", 199 syllables from bar 55; lines cut by timing.
  To check by ear: bars 231–258 and 313–384 with YouTube. If the tab ring does not stay on the bass
