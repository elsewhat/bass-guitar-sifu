notes: >-
  Standard tuning, 98 BPM. Meter changes: 5/4 and 2/4 in the tacet prelude (27–31), 3/4 and 4/4
  alternating in 98–113, 2/4 at 114 (tacet). The only section markers are "Prelude" (bar 1, all
  tacet) and "Intro" (bar 32, spanning the whole bass part), so chunks have musical names instead,
  reused for the same material: C drone/C chug (C on A3, held or in eighths), Drone C–F–G (C held,
  then F on E1/D3 rising to G; "b" is the 6-bar version), Drone F–G (the same without the C),
  Descent (F→E♭, D, C♯ chug, 6 bars), Odd-meter descent / C–F (the 3/4–4/4 passage),
  F–E♭ figure (F–E♭ on D3/D1 answered by a held C), C hits (two C eighths in otherwise silent
  stretches), C–F bounce, Whole-note C and Final C (one C every two bars to the end). Tacet:
  1–31, 114, 132–142, 144, 146–162, 164, 166–170, 172, 174–213, 283, 330–357. The C hits chunks
  (143–145, 163–165, 171–173) each contain one isolated tacet bar (144, 164, 172) so they are
  not one-bar chunks. The 37-bar chug 214–250 is split 4 + 16 + 16 and its last bar (250) leads
  into the first F–E♭ figure. 298–306 is one tied C, so it is split across "C chug" and
  "Whole-note C a" to keep a pluck in each chunk. Fingering overrides: bar 32 and bar 291 put the C (A3) under the index
  finger in position 3. Without them the solver plays the long C passages (32–47 with eight bars
  of eighths, and 291–329 to the end) with the little finger in position 1, because it plans for
  the next F on E1 and treats held notes as no break; for a beginner a teacher would chug with the
  index and move during the held C. Re-tabs (7, accepted): G on D5 → open G (bars 82, 90, 97,
  after F on D3 with the little finger), F on A8 → D3 (bars 106–107, stays in position 2).
  YouTube (2026-10-11): Songsterr's default video for this tab, "Un Chien D'espace" by Motorpsycho -
  Topic (DMFz6CMKC4E). Sync anchors are Songsterr's point per bar (song 2162260, revision 3153494;
  npm run fetch-video): 357 anchors for 357 bars, bar 1 at 0:00.00, up to 45.0 s from the score's
  tempo map (bar 357). To check by ear: 1 extra point at the end ignored.
lyrics:
  # Pasted by the owner (Motorpsycho's shared lyrics, motorpsycho.fix.no); unsynced, ADR-0024.
  text: |
    Don't break the illusion
    I love you the way I dream of you
    I don't want to know
    I'm happily guessing like dreamers do

    By keeping me blind, funny valentine
    You show me who I am
    And make me like what you see
    When you look at me

    If knowledge is secret
    I won't say you shared it and break my oath
    But bridging the gap
    And drawing some stupid map may hurt us both

    I won't leave no message, I'll just shut my mouth
    And keep dreaming golden dreams...
