notes: >-
  Transcribed from the recording by analysis (ADR-0030, 2026-10-12), not by ear and not from a tab:
  no tab of this song exists. Expect wrong notes and check by ear.
  The recording: Roadwork Vol. 1 (live in Europe 1998), track 1, an early version of The Other Fool,
  the upload "The Other Other Fool (Live)" by Motorpsycho - Topic (IHORZUZdTpQ).
  Method: drums and vocals removed with Demucs; the lowest voice read per eighth note on a beat grid
  tracked in the recording; bars that sound alike vote together, so small variations between repeats
  are smoothed away. Where the bass rests, the lowest guitar note is written.
  The song: 326 bars at about 135 BPM, standard tuning. Nearly all of it is one figure on E: D E .
  E, F♯ E . E (the D on the open D string, E and F♯ on frets 2 and 4), with a bar of held E every
  few bars, a turn E . . G . A . A in places, and a part with long F♯ and E notes (about 3:04–3:17
  and 6:38–6:50). The snare is on beat 3.
  Nothing in this recording sounds below the D of the open D string, and Demucs found almost no bass
  in it. So the line is written where it sounds, on the D and G strings; it may partly be a guitar's
  low strings. An octave lower (open E string) would also fit the song.
  Bar lines: bar 1 is a 3/8 pickup; bars 111, 144, 215 and 238 are 7/8, where the figure comes back
  an eighth early. Bars 2–6 are silence before the band starts, and after about 8:14 (bar 282) the
  drums stop and the bars are only a grid. The score ends at 9:36; the recording runs to 10:40.
  YouTube: the sync anchors are the bar starts measured in the recording (ADR-0029), not Songsterr
  points. Do not run fetch-video --write for this song.
  To check by ear: the octave, whether the first note of the figure is D or A (both were read), the
  7/8 bars, and the looser parts between 3:40 and 5:30.
