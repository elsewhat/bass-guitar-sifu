notes: >-
  Artist: the tab and the .gp credit "Motorpsycho, Bent Sæther"; the album and iTunes credit
  Motorpsycho, which keeps the song with the band in the library. Standard tuning, 6/8 at 98 BPM
  (quarter notes; the dotted quarter is about 65), almost all sixteenth notes. Bars 1–2 and 197–202
  are tacet.
  Songsterr does not flag the tab as AI-generated, but the revision (song 4444486, revision 9445142)
  is described as "regenerated" and every track name ends in "(retranscribed)": treat it as an AI
  transcription, and check the tab ring against the bass by ear (ADR-0029).
  No section markers. A–G riff: A pedal against G and E in sixteenths ("to high A" ends on A an
  octave up, "to E" on E sixteenths, "to D–E" on a D–C♯–B–A run and E). B–C♯–D climb (23–30, 59–66):
  B–A, C♯–B–G♯, D–C♯–A. A–D figure (31–38, 67–74, 109–116, 149–156): A–B–C♯–E–F♯ to D, and
  E–F♯–G♯–B–C♯ to C♯–D. B–A climb, High B–A, Descent (thirds down from D3) and Scale up (75–90). B–E
  stabs (91–98, 133–148). High climb (129–132, up to A at fret 14 of the G string). Climb to E
  (193–196).
  Fingering: 7 re-tabs (C♯3 D11 → G6 in bar 124; A3 D19 → G14 in bar 130, whose run still reaches
  fret 17 of the D string in position 14); no overrides. The climbs drop from position 5 to 2 (bars 24, 60).
  YouTube (2026-10-30): Songsterr's default video, "Whip That Ghost" by Motorpsycho - Topic
  (Bo749ncghb8). Sync: 210 anchors for 210 bars, bar 1 at 0:00.00, at most 0.25 s from the tempo
  map.
  Music: offset 0 ms, no drift (onset match 2.7 / 3.1). The tab has no vocal track, so no lyrics;
