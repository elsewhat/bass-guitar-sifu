notes: >-
  No tacet bars. Chunks follow the 8 section markers in 4-bar phrases, one per chord cycle
  (G–B–C–Cm); the three "Chorus" markers are numbered. Most 4-bar phrases differ slightly
  (fills in the last bar), so there are few merges. Verse 1 a and c are identical. Verse 3 b
  (77–80) is a 2-bar figure played twice and kept as one 4-bar chunk. Chorus 3 c is the
  3-bar ending. Fingering: both re-tabs accepted (bar 60 A1 on the open A string, bar 66 G2 on
  the open G string; open strings in low positions). No overrides. The 8 shifts of 3+ frets
  (bars 8, 17, 24, 25, 40, 42, 49, 57) are all chord-change fills in the source tab: the
  walk-up C–D–D♯ (A3, A5, A6) to F on E1 or A8, or the octave D on G7 (bar 41), then back to G
  on E3. None has an open-string
  or same-position alternative. The verse moves the hand between positions 1–3 on
  G (E3) / B (A2) / C (A3) because G and C sit at the same fret on adjacent strings and rule 6
  (no rolling) forbids one finger for both. The owner should check whether this is too busy.
  YouTube: official video on the Radiohead channel (3:57, the same as the score); sync
  anchors still needed.
