notes: >-
  A copy of Vortex Surfer for comparison (ADR-0029): Songsterr's AI retranscription of the same tab
  (song 2582753), exported 2026-09-29. 236 bars at 107 BPM with 2/4 bars at 63, 70 and 72, and eight
  tracks, among them a vocal track that gives synced lyrics. Bass: from bar 131 it is the bass of
  songs/vortex-surfer one bar number later, so the chunks are that song's chunks moved by one bar.
  Bars 124–127 (Lead-in: B, G, G, A, an octave below the guitar) are in this file only; the recording
  has no bass below the guitar's notes before the loud part. Up to bar 62 the bar lines are half a
  bar away from the chord changes in the recording; the 2/4 bars put them right from bar 73.
  YouTube (2026-10-11): the same video as songs/vortex-surfer, "Motorpsycho - Vortex Surfer" by
  Overdrive Arcade (ENZaFo2cEog). Songsterr has no points for this file. The anchors are measured in
  the recording (ADR-0029): beat b of this score is eighth 2b+1 of the grid tracked from the
  recording's onsets. Checked on the guitar track's chord changes in bars 15–52 (every one on its
  eighth) and on the bass's pitch changes from bar 131 (within about 30 ms). Do not run fetch-video
  --write for this song. No Music source: the inbox MP3 with this file's date is rendered from the
  243-bar score (110 BPM) and is attached to songs/vortex-surfer. Lyrics: the words and their timing
  are the AI's reading of the singing, not checked. To check by ear: the tab ring on the bass with
  YouTube from bar 131 and from bar 193, and the lit word on the singing from bar 32.
