notes: >-
  E♭ standard tuning (all four strings a half step down). Title casing follows the album
  ("on"). Tacet: 1, 10–13, 62–65 and 82. Chunks follow the 9 section markers in 4-bar
  phrases; the two "Chorus" markers are numbered 1–2 here. Intro a (2–9) is the F octave
  figure; Intro b, Outro 1 and Outro 2 a are the muted-chord scratch riff (319 dead notes:
  the four-string mutes are notated as x on every string); Outro 2 b returns to the octave
  figure. Solo is the verse riff. Bridge (50–53) is the only busy part: triplets up the neck
  and a jump to frets 12–16 in bar 53. Re-tabs accepted: bar 51 ends on the open A♭ string
  instead of E♭5 (same pitch, gives a break before bar 52), and bar 53 plays the B♭ figure on
  E♭7 instead of A♭2 because the hand is already at fret 7 at the end of bar 52, which halves
  the jump to fret 14. The verse E♭2 is played with the middle finger in position 1 because
  fret 1 follows each second bar; bar 50 starts with the middle finger so the index does not
  roll from the E♭ to the A♭ string at fret 2. No overrides. YouTube (2026-10-11): Songsterr's
