notes: >-
  Drop D (D A D G). 85–90 BPM in 4/4, with 6/4 and 7/4 bars in the choruses and the interlude. Bars
  1–9 (the intro), 50 and 103 are tacet. Chunks follow the 15 section markers; repeated sections are
  numbered. Pre-Verse and Post-Chorus: the E–D octave figure (low D 2, open D). Verse a: E–D in
  dotted eighths; b: the E–E–D syncopation, ending E–G–G. Chorus (6/4 6/4 6/4 7/4): E, the C5 dyads
  and a D run. Bridge: a pickup bar (51) and the two-bar D–E–F figure, then three more times
  (54–59); b is the D–E–G–A sixteenth run and the figure, twice; c the run four times. Climax a/b:
  E–F♯ and B–A cells. Interlude a: the C–D / E figure; b (84–88): the 6/4 line down
  A–E–A–C–G–F♯–D–A, twice. Pre-Chorus 3: a dead-note 6/4 bar and the G/A dyads, twice. Outro: F–E
  and E–E figures, ending on a held E. Fingering: 20 re-tabs, mostly D2 A5 → D0 (open D). No
  overrides. The Bridge run (60–61, 64–65, 68–71) lies on the low D string, frets 0–7, so it shifts
  through positions 2, 3 and 5 every half bar in the 1-2-4 box. The Outro's E octaves (low D 2 and D
  2, bars 98 and 100) are an index barre in position 2 (ADR-0007, 2026-11-05). YouTube: M1tIH55Bo8k,
  "TOOL - Stinkfist (Official Audio)" by TOOLVEVO, Songsterr's default video for song 19811
  (songsterr.com/a/wsa/tool-stinkfist-bass-tab-s19811), revision 9707346: 103 anchors for 103 bars,
  bar 1 at 0:01.81; bar 8 is ×0.70 of its length; at most 2.0 s from the tempo map (bar 102).
  Songsterr's API answers 403 to scripts, so the points were read from the tab's page in the browser
  on 2026-11-06 and replayed to fetch-video. It plays and embeds from Norway (checked 2026-11-06).
  Music: offset 0 ms, no drift (onset match 2.02 / 1.92). Lyrics: synced from "Maynard J. Keenan -
  Vocals", 346 syllables from bar 14; lines cut by timing.
