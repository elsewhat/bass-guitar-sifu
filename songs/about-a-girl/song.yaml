notes: >-
  Studio (Bleach) version: Chad Channing on drums, 2:50 in the score. Bass enters at bar 5 with
  the band ("Intro B (Band-In)"); bars 1–4 (guitar riff alone) and 93 are tacet. Chunks follow
  the 13 section markers split at the 2-bar riff: the E–G intro/post-chorus riff (A B), the
  verse riff (C D) and the chorus (F G F H/K, then I J). Chorus 1 b / 2 b are the 2-bar
  I J turnaround kept apart because the hand moves from position 2 to 3. "Post-Solo/ Pre-Verse"
  is shortened to Post-Solo: a = chorus figure, b = turnaround, c = intro riff. Verse 3 a
  holds the one variant bar (64, position 5). Bar 80 is 2/4 and ends Chorus 3 c. Outro b is
  one open E held for four bars (tempo slows to 115 BPM at bar 90). Tempo map 127–134 BPM
  follows the recording; no half/double time. Fingering: no re-tabs and no shifts of 3+ frets;
  no overrides. The chorus alternates A4 and E4 between fingers 2 and 4 because rule 6
  (no rolling) forbids the same finger on both strings at fret 4. YouTube (2026-10-11): Songsterr's
  default video for this tab, "About A Girl" by Nirvana - Topic (YYfSbR8xs2c). Sync anchors are
