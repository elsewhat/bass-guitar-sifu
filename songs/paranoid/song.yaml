notes: >-
  Standard tuning, 163 BPM throughout, matching the recording (no half/double-time issue). Bass
  enters with a pickup B in bar 4 (bars 1–3 tacet), so the Intro chunk is 4–8. Chunks follow the
  9 section markers in 4-bar phrases (E-chug, D, turnaround). Verse 2 c/d (33–40) are the
  quarter-note E and D/E octave bars. Verse 4 c (89–96) is the same C–D–E figure as the
  Interlude (17–24) but sits under the "Verse 4" marker. Fingering: the E chug moves between
  positions 5, 6 and 7 depending on the next figure (little finger when a D follows without a
  break, index after the pos-7 D7/D9/G7/G9 fill); this follows the ADR-0007 rules and was kept.
  The 48 re-tabs are all the D bar after that fill (bars 31, 55, 79, 99, 103, 111): A5 → open D,
  so the hand can come down from position 7 without a two-fret shift on continuous eighths;
  accepted as a beginner simplification (the other D bars stay on A5). Large shifts at bar 5
  (B on A2 → E on A7, the pickup) and bars 22/94 (E → C on A3) are inherent to the line.
  YouTube (2026-10-11): Songsterr's default video for this tab, "Black Sabbath - Paranoid (Official
  Audio)" by RHINO (BOTIIw76qiE). Sync anchors are Songsterr's point per bar (song 296, revision
  9327542; npm run fetch-video): 112 anchors for 112 bars, bar 1 at 0:00.00, up to 0.4 s from the
  score's tempo map (bar 6).
