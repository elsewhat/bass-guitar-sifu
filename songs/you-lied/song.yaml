notes: >-
  Transcribed from the recording by analysis (ADR-0030, 2026-10-12), not by ear and not from a tab:
  no tab of this song exists. Expect wrong notes and check by ear.
  The recording: Roadwork Vol. 1 (live in Europe 1998), track 4, the upload "You Lied (Live)" by
  Motorpsycho - Topic (KhNfjWN1KEg).
  Method: drums and vocals removed with Demucs; the lowest voice read per sixteenth note on a beat
  grid tracked in the recording; bars that sound alike vote together, so small variations between
  repeats are smoothed away; the octave is the lower one when its fundamental is in the sound. Where
  the bass rests, the lowest guitar note is written.
  The song: 99 bars, standard tuning. Main riff (bars 2–62 and 74–94): the pickup A–C, then D . D .
  A C A D A D . D . A C, all on the A string (D on fret 5, C on fret 3, open A). A bar that starts
  on a held G comes about every eighth bar (29, 37, 51, 59). Bars 63–64 are a stop. Middle riff
  65–73 on A and E. From bar 95 the ending is loose and the reading is rough.
  Bar lines: bar 1 is a 5/8 pickup, bars 75, 88 and 90 are also 5/8, and bars 73 and 92 are 9/8.
  Bars 36, 39, 73 and 82 are one sixteenth longer in the playing than they are written (their last
  note takes it up), and bars 75, 88 and 90 one sixteenth shorter (their last two sixteenths are
  squeezed into one); those seven bars have a second anchor. The odd bars follow how the band played
  the turns; some may be the beat tracker's doing.
  YouTube: the sync anchors are the bar starts measured in the recording (ADR-0029), not Songsterr
  points. Do not run fetch-video --write for this song.
  To check by ear: the octave of the A (written as the open A string; the guitar plays it an octave
  up), the first sixteenth of each bar (C held over the bar line or D struck), the G bars, and the
  middle riff.
