notes: >-
  Transcribed from the recording by analysis (ADR-0030, 2026-10-12), not by ear and not from a tab:
  no tab of this medley exists. Expect wrong notes and check by ear.
  The recording: Roadwork Vol. 1 (live in Europe 1998), track 3, Superstooge into The Wheel, the
  upload "Super/Wheel (Live)" by Motorpsycho - Topic (uKOC9CpTs5I). The library's The Wheel
  (songs/the-wheel) is another take in another key.
  Method: drums and vocals removed with Demucs; the lowest voice read per eighth note on a beat grid
  tracked in the recording; bars that sound alike vote together, so small variations between repeats
  are smoothed away. Where the bass rests, the lowest guitar note is written.
  Superstooge, bars 1–110 (to 3:35): a two-bar riff in D, A♭ . A♭ F D D D A, then D G F D . D C F.
  The drums group its sixteen eighth notes as nine and seven; it is written as two bars of 4/4. Bar
  63 is 3/4. Jam, 111–199 (to 6:21): the band plays in a six-eight feel at about 127 BPM; it is
  written in 4/4 and the reading is rough. Bridge, 200–241: long notes on A, G and F (bar 200 is
  3/4).
  The Wheel, from bar 242 (7:42): the riff D D D . D . D D, then C D D . D . D C, with the snare on
  beat 3; a turn through G, C and F at 320–327 and 440–447; the riff an octave up at 328–342
  (written where it was read, on the G string; it may be the guitar). The score ends at 15:14; the
  recording fades to 16:22.
  Octaves: in the last minutes of The Wheel a D an octave below the bass's lowest string sounds
  (bass pedals or a detuned string). It is written an octave up, as the D on the A string. Standard
  tuning is assumed.
  YouTube: the sync anchors are the bar starts measured in the recording (ADR-0029), not Songsterr
  points. Do not run fetch-video --write for this song.
  To check by ear: where the Superstooge riff starts in the bar, the A♭ and F against the guitar,
  the jam, and whether The Wheel riff sits right on the snare.
