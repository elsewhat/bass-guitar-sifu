<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Song selector · library overlay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&amp;family=Noto+Music&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121212}
button{font-family:Figtree,"Helvetica Neue",helvetica,arial,sans-serif}
button:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; background: #121212">
  <dc-import name="Main" selector="overlay" picker-open="true" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
