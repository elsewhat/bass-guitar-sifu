<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>alphaTab spike (ADR-0017)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;800&family=Noto+Music&display=swap"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; padding: 16px; background: #121212; color: #fff; font-family: Figtree, sans-serif; }
      .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; font-size: 14px; flex-wrap: wrap; }
      .controls select, .controls button { background: #1f1f1f; color: #fff; border: 1px solid #4d4d4d; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
      /* Strip geometry from design/artboards/TabStrip.dc.html */
      .strip { position: relative; width: 1408px; height: 276px; background: #181818; border-radius: 8px; overflow: hidden; }
      .clip { position: absolute; left: 72px; top: 0; width: 1336px; height: 276px; overflow: hidden; }
      /* alphaTab only renders into a container with a size; the horizontal layout overflows it. */
      #at { position: absolute; left: 0; top: 0; width: 1336px; transform-origin: 0 0; will-change: transform; }
      .playhead { position: absolute; left: 165px; top: 24px; width: 30px; height: 212px; box-sizing: border-box; background: rgba(255,255,255,0.07); border-left: 1px solid rgba(255,255,255,0.35); border-right: 1px solid rgba(255,255,255,0.35); pointer-events: none; }
      .gutter { position: absolute; left: 0; top: 0; width: 72px; height: 276px; background: #181818; box-shadow: rgba(0,0,0,0.5) 8px 0 12px; }
      .gutter .line { position: absolute; left: 8px; width: 64px; height: 1px; background: #7c7c7c; }
      .gutter .clef { position: absolute; left: 12px; font-family: 'Noto Music', serif; font-size: 34px; line-height: 40px; color: #fff; }
      .gutter .time { position: absolute; left: 46px; width: 16px; text-align: center; font-size: 19px; line-height: 19px; font-weight: 800; }
      .gutter .tab { position: absolute; left: 14px; width: 14px; display: flex; flex-direction: column; align-items: center; font-size: 15px; line-height: 19px; font-weight: 800; }
      .gutter .badge { position: absolute; left: 44px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }
      .gutter .label { position: absolute; left: 12px; top: 30px; font-size: 12px; line-height: 16px; font-weight: 700; color: #b3b3b3; }
      #status { font: 12px ui-monospace, monospace; color: #b3b3b3; margin-top: 12px; white-space: pre; }
    </style>
  </head>
  <body>
    <div class="controls">
      <select id="song"><option value="vortex-surfer">Vortex Surfer</option><option value="killing-in-the-name">Killing in the Name</option></select>
      <select id="chunk"></select>
      <select id="speed"><option>0.5</option><option selected>0.75</option><option>0.9</option><option>1</option></select>
      <select id="scroll" title="Scroll mapping"><option value="smooth:960">Scroll: smoothed over 1 beat</option><option value="smooth:1920" selected>Scroll: smoothed over 2 beats</option><option value="smooth:3840">Scroll: smoothed over 1 bar</option><option value="bar">Scroll: constant per bar</option><option value="note">Scroll: jump per note gap (alphaTab-like)</option></select>
      <button id="play">Play / pause</button>
      <button id="restart">Restart chunk</button>
      <label><input type="checkbox" id="advance" checked /> auto-advance after 3 passes</label>
    </div>
    <div class="strip">
      <div class="clip" id="clip">
        <div id="at"></div>
        <div class="playhead"></div>
      </div>
      <div class="gutter" id="gutter"></div>
    </div>
    <div id="status"></div>
    <script type="module" src="/src/spike/spike.ts"></script>
  </body>
</html>
